@if (cv(); as c) {
  <div class="card">
    <img [src]="c.path" [alt]="c.firstname">
    <h2>{{ c.firstname }} {{ c.name }}</h2>
    <p class="job">{{ c.job }}</p>
    <dl>
      <dt>Âge</dt><dd>{{ c.age }} ans</dd>
      <dt>CIN</dt><dd>{{ c.cin }}</dd>
      <dt>Id</dt><dd>{{ c.id }}</dd>
    </dl>
  </div>
} @else {
  <p class="placeholder">Cliquez sur un CV pour voir ses détails.</p>
}
